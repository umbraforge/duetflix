<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuetFlix</title>
<style>
  :root { --umbra:#08060b; --surface:#141018; --ember:#ff7a00; --text:#f4f1f6; --muted:#a49fae; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #1a0f08, var(--umbra));
    color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid; place-items:center; -webkit-font-smoothing:antialiased; }
  .card { text-align:center; padding:56px 28px; max-width:460px; }
  .mark { width:72px; height:72px; border-radius:20px; background:var(--ember); margin:0 auto 22px;
    display:grid; place-items:center; color:var(--umbra); font-size:40px;
    box-shadow:0 12px 40px rgba(255,122,0,.35); }
  h1 { font-size:38px; margin:0 0 6px; letter-spacing:.5px; }
  .tag { color:var(--muted); font-size:18px; margin:0 0 34px; }
  .links { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .links a { text-decoration:none; padding:12px 22px; border-radius:999px; font-weight:600;
    border:1px solid #2c2338; color:var(--text); }
  .links a.primary { background:var(--ember); color:var(--umbra); border-color:var(--ember); }
  footer { color:var(--muted); font-size:13px; margin-top:38px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">♥</div>
    <h1>DuetFlix</h1>
    <p class="tag">What should we watch tonight? · Bu akşam ne izlesek?</p>
    <div class="links">
      <a class="primary" href="support.html">Support</a>
      <a href="privacy.html">Privacy Policy</a>
    </div>
    <footer>An iOS app by UmbraForge</footer>
  </div>
</body>
</html>
